name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: warp
          POSTGRES_PASSWORD: warp
          POSTGRES_DB: timeoff
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U warp -d timeoff"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements.txt
      - run: cd frontend && npm ci
      - run: make migrate
      - run: make test
      - run: make lint
      - run: cd frontend && npm run lint && npm run typecheck && npm run build
      - run: make contracts
      - run: git diff --exit-code -- docs/openapi.json frontend/src/api/schema.d.ts
