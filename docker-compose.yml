services:
  db:
    image: postgres:16
    container_name: warp_timeoff_db
    environment:
      POSTGRES_USER: warp
      POSTGRES_PASSWORD: warp
      POSTGRES_DB: timeoff
    ports:
      - "5433:5432"
    volumes:
      - warp_timeoff_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warp -d timeoff"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  warp_timeoff_pgdata:
